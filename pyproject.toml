[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "agensgraph-python"
description = "AgensGraph driver for Python, built on psycopg 3"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = [
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3.1",
    "msgspec>=0.19",
]
keywords = ["agensgraph", "graph", "database", "postgresql", "cypher", "gql", "driver"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[[project.authors]]
name = "Muhammad Taha Naveed"
email = "skaisw@skaiworldwide.com"

[project.urls]
Homepage = "https://github.com/skaiworldwide-oss/agensgraph-python"
Source = "https://github.com/skaiworldwide-oss/agensgraph-python"

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.33"]
arrow = ["pyarrow>=17"]
pandas = ["pandas>=2.2"]
polars = ["polars>=1.0"]

[dependency-groups]
tests = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    # Not a dependency of anything shipped. The dialect is an acceptance test for the PEP 249
    # surface, and without this it skips itself rather than saying the surface is untested. The
    # floor is 2.0.31 because that is the first release that imports at all on the Pythons tested
    # here -- earlier ones assert against class attributes 3.13 added.
    "sqlalchemy>=2.0.31",
]
typing = [
    "mypy>=1.13",
    "typing-extensions>=4.12",
]
lint = ["ruff>=0.16"]
dev = [
    {include-group = "tests"},
    {include-group = "typing"},
    {include-group = "lint"},
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/agensgraph"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
xfail_strict = true
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "server: needs a live AgensGraph server (set AGENSGRAPH_TEST_DSN)",
]

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "TC", "PT"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# A generated file, so it is not edited to satisfy a style rule. Its source has a plain
# block around an awaiting one, which cannot be combined; and an awaiting generator cannot
# delegate with `yield from`, so the loop that becomes redundant once converted has to stay.
"src/agensgraph/connection.py" = ["SIM117", "UP028"]
# A rejection is deliberately one exception type, so tests assert on that type rather
# than on a message that is free to change. Parametrised cases are read as a list of
# rows. The corpus holds characters that look like other characters on purpose.
"tests/*" = ["PT006", "PT011", "B017", "RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/agensgraph"]

# Tracing is optional, so the package may not be installed at all -- which is not an error here,
# since the one import of it is inside a try that says what to install. It does ship its own types
# when it is present, and is checked then.
[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

# The columnar backends are optional and imported where they are used. Their own stubs are not
# followed: numpy's need a newer Python than the floor checked here.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "pandas.*", "polars.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pyright]
include = ["src/agensgraph"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

# The columnar backends are optional, imported where they are used, and ship no stubs.
reportMissingImports = "warning"
reportMissingTypeStubs = "warning"

# What a decoder and a cursor hand back is Any, and every value read from either carries that
# through whatever it touches. These three report the shape of that typing rather than anything
# about this code, and there are thirty-five of them against a driver whose whole job is to receive
# untyped values and give them names.
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"

# psycopg declares a statement as a LiteralString, to discourage one built by joining text. This
# driver builds its statements and quotes every identifier that goes into one, so what it passes is
# a str and cannot be a literal.
reportArgumentType = "warning"
reportCallIssue = "warning"

# The pool reads the generation stamped on a connection by this same package.
reportPrivateUsage = "none"
