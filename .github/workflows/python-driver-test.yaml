name: Python Driver Tests

on:
  push:
    branches: [ '*' ]
    paths-ignore:
      - 'README.md'
      - 'VERSION.md'
  pull_request:
    branches: [ '*' ]
    paths-ignore:
      - 'README.md'
      - 'VERSION.md'
  workflow_dispatch:

jobs:
  # Everything that needs no server, on every version claimed to be supported, on amd64 and arm64
  # natively. Kept apart from the server suites so a lint or typing failure is reported in seconds.
  checks:
    name: checks (${{ matrix.python-version }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        runner: ['ubuntu-latest', 'ubuntu-24.04-arm']

    steps:
      - uses: actions/checkout@v4
        with:
          # The version comes from the tags, so a shallow clone would bake in a wrong one.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        # --all-extras, so the columnar backends are present. Without them the whole of
        # columnar.py's suite skips itself, which reads as a pass.
        run: uv sync --group dev --all-extras --python ${{ matrix.python-version }}

      - name: Format and lint
        run: |
          uv run ruff format --check src tests tools
          uv run ruff check src tests tools

      # Both, because they disagree: pyright has found defects mypy passed, and the reverse.
      - name: Types
        run: |
          uv run mypy
          uv run pyright

      # Three separate things go wrong here, so all three are checked: a generated file edited
      # directly, a generated file left behind by an edit to its source, and an awaiting module
      # added without being listed for conversion at all.
      - name: The generated interface is what its source says
        run: uv run python tools/async_to_sync.py --check

      # -X dev makes ResourceWarning visible, which is the only way an unclosed socket is found,
      # and turns on asyncio's own debug mode. It does not imply -W error, so both are passed.
      - name: Tests
        run: uv run python -X dev -W error -m pytest -q

      - name: Import time
        run: uv run python -X importtime -c "import agensgraph" 2>&1 | tail -1

  # Atheris ships wheels for cp312 and later on Linux x86_64 and no source distribution, so this
  # cannot be part of the matrix above.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          uv sync --group dev --python 3.13
          uv pip install atheris
      - name: Fuzz what reads the text rendering
        run: uv run python tests/fuzz_textfmt.py -atheris_runs=200000 -print_final_stats=1
      - name: Keep whatever it found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: |
            crash-*
            timeout-*
            oom-*

  # A declared floor is only a claim until something resolves to it, on each architecture.
  lowest-versions:
    name: lowest-versions (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ['ubuntu-latest', 'ubuntu-24.04-arm']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Resolve to the lowest declared versions, and test against those
        run: |
          uv sync --group dev --resolution lowest-direct
          uv run python -m pytest -q

  # A package that type-checks in its own tree can still ship without the marker saying so, and a
  # source distribution built away from the tags can still carry a wrong version. Neither is found
  # except by installing what would actually be published.
  package:
    name: package (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ['ubuntu-latest', 'ubuntu-24.04-arm']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5

      - name: Build both distributions
        run: uv build

      - name: Install the wheel into a clean environment
        run: |
          uv venv /tmp/from-wheel
          VIRTUAL_ENV=/tmp/from-wheel uv pip install dist/*.whl
          VIRTUAL_ENV=/tmp/from-wheel uv run python - <<'EOF'
          import pathlib
          import agensgraph
          print("version", agensgraph.__version__)
          assert not agensgraph.__version__.startswith("0.0.0"), (
              "the version did not come from the tags"
          )
          marker = pathlib.Path(agensgraph.__file__).parent / "py.typed"
          assert marker.exists(), "the typing marker is missing, so nothing downstream is checked"
          EOF

      - name: Install from the source distribution too
        run: |
          uv venv /tmp/from-sdist
          VIRTUAL_ENV=/tmp/from-sdist uv pip install dist/*.tar.gz
          VIRTUAL_ENV=/tmp/from-sdist uv run python -c "import agensgraph; print(agensgraph.__version__)"

  # The full suite against every release the driver supports, each from its published image plus
  # pgvector. Running the same suite against all of them is what checks the version gates: a test
  # that needs something only the newest has, and does not say so, fails on the older ones instead
  # of passing everywhere by accident.
  #
  # Each release runs on amd64 and arm64. The image is built in every run, for the runner's own
  # architecture -- every base is multi-arch, so there is no emulation -- and never published. The
  # build cache makes a warm build a few seconds; a cold one is about 35, almost all of it
  # installing a compiler.
  against-a-release:
    name: against ${{ matrix.release }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        release: ['2.14.1', '2.15.0', '2.16.0', '2.17.0', '2.18.4.0', '2.18.6.1']
        runner: ['ubuntu-latest', 'ubuntu-24.04-arm']
        include:
          - {release: '2.14.1', python: '3.11'}
          - {release: '2.15.0', python: '3.13'}
          - {release: '2.16.0', python: '3.13'}
          - {release: '2.17.0', python: '3.13'}
          - {release: '2.18.4.0', python: '3.13'}
          - {release: '2.18.6.1', python: '3.14'}
    env:
      # The image's superuser: postgres up to 2.17, agens from 2.18.
      AG_USER: ${{ startsWith(matrix.release, '2.18') && 'agens' || 'postgres' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Build the test image
        uses: docker/build-push-action@v6
        with:
          context: tests/images
          build-args: |
            BASE=skaiworldwide/agensgraph:v${{ matrix.release }}-bookworm
            AGVERSION=${{ matrix.release }}
          tags: agensgraph-test:${{ matrix.release }}
          load: true
          push: false
          cache-from: type=gha,scope=agensgraph-test-${{ matrix.release }}-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=agensgraph-test-${{ matrix.release }}-${{ runner.arch }}

      # Healthy means the server answers *and* reports the release the image was built for, so a
      # mislabelled base fails here instead of testing the wrong line.
      - name: Start it
        run: |
          docker run -d --name agensgraph -e POSTGRES_PASSWORD=agens -p 5432:5432 \
            agensgraph-test:${{ matrix.release }}
          for _ in $(seq 90); do
            status=$(docker inspect -f '{{.State.Health.Status}}' agensgraph)
            [ "$status" = healthy ] && break
            sleep 1
          done
          [ "$status" = healthy ] || { docker logs agensgraph | tail -50; exit 1; }
          docker exec agensgraph psql -U "$AG_USER" -d postgres -qc 'CREATE DATABASE drv_test'
          found=$(docker exec agensgraph psql -U "$AG_USER" -d drv_test -tAc \
            "SELECT count(*) FROM pg_type WHERE typname IN ('vector', 'halfvec', 'sparsevec')")
          test "$found" = "3" || { echo "expected the three vector types, found $found"; exit 1; }

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --group dev --all-extras --python ${{ matrix.python }}

      # A test needing a server skips itself when this variable is absent, so a job that lost it
      # would report a clean pass over the half of the suite that matters. Reaching the server is
      # checked first, and afterwards no test may have skipped for a reason that means the job
      # itself was set up wrong: no second role, or no vectors.
      - name: The full suite, against the server
        env:
          AGENSGRAPH_TEST_DSN: host=127.0.0.1 port=5432 user=${{ env.AG_USER }} password=agens dbname=drv_test
        run: |
          uv run python - <<'EOF'
          import os
          import agensgraph
          with agensgraph.connect(os.environ["AGENSGRAPH_TEST_DSN"]) as conn:
              print("reached", conn.capabilities.reported)
          EOF
          # pipefail: the default shell is bash -e without it, and tee would hide a failure.
          set -o pipefail
          uv run python -X dev -W error -m pytest -q -rs | tee pytest.log
          if grep -E "connect as another role|vector extension is not created" pytest.log; then
            echo "tests skipped because this job was set up wrong"; exit 1
          fi

      - name: The server's own log, if anything failed
        if: failure()
        run: docker logs agensgraph 2>&1 | tail -100
